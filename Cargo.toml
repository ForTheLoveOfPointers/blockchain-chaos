[workspace]
resolver = "2"
members = ["crates/proxy", "crates/scenario", "crates/cli", "examples/block-watcher", "crates/observability"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ForTheLoveOfPointers/blockchain-chaos"
rust-version = "1.80"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "2"
futures-util = "0.3"
bytes = "1"
url = "2"
humantime = "2"
rand = "0.10"
rand_chacha = "0.10"
serde_yaml = "0.9"

[profile.release]
lto = "thin"
